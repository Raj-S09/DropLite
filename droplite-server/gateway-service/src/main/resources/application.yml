server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true   # Enables service discovery via Eureka
          lower-case-service-id: true   # Ensures service ID is lowercase
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
          filters:
            - StripPrefix=1

        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/files/**
          filters:
            - StripPrefix=1

  application:
    name: gateway-service

# Allow CORS
cors:
  allowed:
    origins: http://localhost,http://localhost:3000

security:
  jwt:
    secret-key: GlG4YF/5EQKJ44SaJtHEd//VJeffEZ0OUCYOKm/TYow=
    expire-in: 43200000 #12 hours in milli
  paths-to-skip: /files/public/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/